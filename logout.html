<!doctype html>
<html lang="en">
<head>
    $(if refresh-timeout)
    <meta http-equiv="refresh" content="$(refresh-timeout-secs)">
    $(endif)
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />   
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Logout Success - PT. SMI </title>
    <link rel="icon" href="img/smi.svg" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', 'hotspot_logout', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=280,height=250');
            window.close();
            return false;
        }
    </script>
</head>

<body class="login-body" $(if advert-pending = 'yes') onLoad="openAdvert()" $(endif)>
    
    <div class="overlay" id="overlay"></div> 

    <div class="login-container">
        

        <div class="login-form-side">
            <div class="form-wrapper">
                <img src="img/logo3x.png" alt="logo_ptsmi" class="logo">                
                
                <h1 class="login-title-logout">Logout Berhasil</h1>
                <p class="description">
                    Terima kasih telah menggunakan jaringan hotspot PT. SMI. Koneksi Anda telah diputus.
                </p>

                <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                    
                    <div class="input-group">
                        <label class="input-label">Username</label>
                        <div class="form-input" style="background-color: #e9ecef; color: #555;">$(username)</div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">IP Address</label>
                        <div class="form-input" style="background-color: #e9ecef; color: #555;">$(ip)</div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Mac Address</label>
                        <div class="form-input" style="background-color: #e9ecef; color: #555;">$(mac)</div>
                    </div>

                    <button type="submit" class="btn-primary" style="margin-top: 20px;">Login Kembali</button>

                <!-- <form name="login" action="$(link-login)"post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                    <button type="submit" class="btn-primary" style="margin-top: 20px;">Login Kembali</button>
                    
                </form> -->


                <script src="/md5.js"></script>


                <div class="footer-text">
                    <a href="https://ptsmi.com/" style="text-decoration: none; color: inherit;">
                        &copy; PT. SMI
                    </a>
                </div>
            </div>
        </div>


        <div class="login-banner-side">
            <div class="slideshow-box">
                <div class="slide-wrapper-grid" id="slideShowGrid">
                    <img src="img/2.svg" alt="Slide 1" class="slide-image-grid">
                    <img src="img/3.svg" alt="Slide 2" class="slide-image-grid">
                    <img src="img/4.svg" alt="Slide 3" class="slide-image-grid">
                    <img src="img/5.svg" alt="Slide 4" class="slide-image-grid">
                </div>
                <button class="nav-btn prev" onclick="plusDivs(-1)">&#10094;</button>
                <button class="nav-btn next" onclick="plusDivs(1)">&#10095;</button>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="security-popup.js"></script>

</body>
</html>
